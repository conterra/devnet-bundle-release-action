name: devnet-bundle-release-action
description: Devnet Bundle Release Action

inputs:
  nexus_id:
    description: "Nexus ID"
    required: true
  nexus_user:
    description: "Nexus User"
    required: true
  nexus_user_pw:
    description: "Nexus User Password"
    required: true
  nexus_url:
    description: "Nexus Url"
    required: true
  nexus_url_release:
    description: "Nexus Url Release"
    required: true
  nexus_url_snapshots:
    description: "Nexus Url Snapshots"
    required: true
  release_token:
    description: "Release Token"
    required: true
  git_mail:
    description: "Git commit author email"
    required: true
  git_user:
    description: "Git commit author name"
    required: true
  release_version:
    description: "Release Version"
    required: true
  next_dev_version:
    description: "Next Dev Version"
    required: false
  demo_user:
    description: "Demo User"
    required: true
  demo_user_pw:
    description: "Demo User PW"
    required: true
  demo_url:
    description: "Demo URL"
    required: true
  run_js_tests:
    description: "Run JS unit tests and publish results"
    required: false
    default: "true"
  run_end_to_end_tests:
    description: "Run Playwright e2e tests and publish results"
    required: false
    default: "false"
  generate_sbom:
    description: "Generate a CycloneDX SBOM"
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - id: checkout
      uses: actions/checkout@v7
    - id: cache-env
      name: Set browser caches into node_modules
      run: |
        echo "PUPPETEER_CACHE_DIR=${{ github.workspace }}/node_modules/.puppeteercache" >> "$GITHUB_ENV"
        echo "PLAYWRIGHT_BROWSERS_PATH=${{ github.workspace }}/node_modules/.playwrightcache" >> "$GITHUB_ENV"
      shell: bash
    - id: cache-maven
      name: Cache Maven repository
      uses: actions/cache@v6
      with:
        path: ~/.m2/repository
        key: maven-v1-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          maven-v1-${{ runner.os }}-
          maven-v1-
    - id: cache-node
      name: Cache node_modules
      uses: actions/cache@v6
      with:
        path: |
          **/node_modules
          **/node
        key: npm-v1-${{ runner.os }}-${{ hashFiles('**/package.json', '**/pnpm-lock.yaml', '**/package-lock.json') }}
        restore-keys: |
          npm-v1-${{ runner.os }}-
          npm-v1-
    - id: setup
      name: Set up JDK 17
      uses: actions/setup-java@v6
      with:
        java-version: '17'
        distribution: 'temurin'
    - id: git
      name: Set GIT username and email
      run: |
        git config --global user.email "${{ inputs.git_mail }}"
        git config --global user.name "${{ inputs.git_user }}"
      shell: bash
    - id: create_settings_xml
      name: "Create settings.xml"
      uses: s4u/maven-settings-action@v4.0.0
      with:
        githubServer: false
        repositories: >
          [
            {
              "id": "central",
              "url": "http://central",
              "releases": {
                "enabled": "true"
              },
              "snapshots": {
                "enabled": "true"
              }
            }
          ]
        pluginRepositories: >
          [
            {
              "id": "central",
              "url": "http://central",
              "releases": {
                "enabled": "true"
              },
              "snapshots": {
                "enabled": "true"
              }
            }
          ]
        servers: >
          [
            {
              "id": "${{ inputs.nexus_id }}",
              "username": "${{ inputs.nexus_user }}",
              "password": "${{ inputs.nexus_user_pw }}"
            }
          ]
        mirrors: >
          [
            {
              "id": "${{ inputs.nexus_id }}",
              "name": "${{ inputs.nexus_id }}",
              "mirrorOf": "central",
              "url": "${{ inputs.nexus_url }}"
            }
          ]
    - id: write_release_versions
      name: Update versions to ${{ inputs.release_version }}
      env:
        RELEASE_VERSION: ${{ inputs.release_version }}
        GIT_USER: ${{ inputs.git_user }}
        RELEASE_TOKEN: ${{ inputs.release_token }}
      run: |
        set -euo pipefail
        mvn validate -B -ntp -P write-release-versions -Dreplace.target.version="${RELEASE_VERSION}"
        mvn versions:set -B -ntp -DnewVersion="${RELEASE_VERSION}" -DgenerateBackupPoms=false
        mvn scm:checkin -B -ntp -DpushChanges=true -Dmessage="[update-version] to ${RELEASE_VERSION}" -Dscm.username="${GIT_USER}" -Dscm.password="${RELEASE_TOKEN}"
      shell: bash
    - id: build
      name: Build
      run: mvn prepare-package -B -ntp -Pinclude-mapapps-deps
      shell: bash
    - id: js_tests
      name: Run JS tests
      if: ${{ inputs.run_js_tests == 'true' }}
      run: mvn test -B -ntp -P include-mapapps-deps,run-js-tests -Dbuild.stage=test
      shell: bash
    - name: Publish JS test results
      if: ${{ always() && inputs.run_js_tests == 'true' }}
      uses: mikepenz/action-junit-report@v6
      with:
        report_paths: 'target/webapp/js/JS-TEST-REPORT-*.xml'
        check_name: 'JS Unit Tests'
    - id: e2e
      name: Run end-to-end tests
      if: ${{ inputs.run_end_to_end_tests == 'true' }}
      run: mvn test -B -ntp -P include-mapapps-deps,run-end-to-end-tests -Dbuild.stage=test
      shell: bash
      env:
        UPDATE_SNAPSHOTS: "false"
    - name: Publish e2e test results
      if: ${{ always() && inputs.run_end_to_end_tests == 'true' }}
      uses: mikepenz/action-junit-report@v6
      with:
        report_paths: 'target/end-to-end/junit.xml'
        check_name: 'End-to-end Tests'
    - name: Upload e2e artifacts
      if: ${{ always() && inputs.run_end_to_end_tests == 'true' }}
      uses: actions/upload-artifact@v7
      with:
        name: e2e-results
        path: target/end-to-end
        if-no-files-found: ignore
    - id: upload_demo
      name: Upload to demo
      run: mvn clean package -Pcompress,upload -Dmapapps.remote.base=${{ inputs.demo_url }} -Dmapapps.user=${{ inputs.demo_user }} -Dmapapps.pw=${{ inputs.demo_user_pw }}
      shell: bash
    - id: nexus_deployment
      name: Publish to Nexus
      env:
        GENERATE_SBOM: ${{ inputs.generate_sbom }}
      run: |
        set -euo pipefail
        PROFILES=compress
        if [ "${GENERATE_SBOM}" = "true" ]; then
          PROFILES="${PROFILES},generate-sbom"
        fi
        mvn clean deploy -X -U -B -ntp -P"${PROFILES}" -Dmaven.test.skip.exec=true -Ddist.releases.id=${{ inputs.nexus_id }} -Ddist.releases.url=${{ inputs.nexus_url_release }} -Ddist.snapshots.id=${{ inputs.nexus_id }} -Ddist.snapshots.url=${{ inputs.nexus_url_snapshots }}
      shell: bash
    - id: project_artifact_id
      name: Extract Maven project artifactId
      run: |
        ARTIFACT_ID=$(mvn -q -Dexec.executable=echo -Dexec.args='${project.artifactId}' --non-recursive exec:exec)
        echo "artifactId=${ARTIFACT_ID}" >> "$GITHUB_OUTPUT"
      shell: bash
    - id: release
      name: Create GitHub release
      uses: ncipollo/release-action@v1
      with:
        # the SBOM only exists if generate_sbom is set; missing files are skipped with a warning
        artifacts: "target/${{ steps.project_artifact_id.outputs.artifactId }}-bundle.zip,target/${{ steps.project_artifact_id.outputs.artifactId }}-sample-app.zip,target/${{ steps.project_artifact_id.outputs.artifactId }}-sbom.cdx.json"
        preRelease: false
        bodyFile: "RELEASE.md"
        allowUpdates: true
        replacesArtifacts: true
        tag: ${{ inputs.release_version }}
        token: ${{ inputs.release_token }}
    - id: write_dev_versions
      name: Update versions to next dev version
      env:
        NEXT_DEV_VERSION_INPUT: ${{ inputs.next_dev_version }}
        RELEASE_VERSION: ${{ inputs.release_version }}
        GIT_USER: ${{ inputs.git_user }}
        RELEASE_TOKEN: ${{ inputs.release_token }}
      run: |
        set -euo pipefail
        NEXT_DEV_VERSION="${NEXT_DEV_VERSION_INPUT}"
        if [ -z "${NEXT_DEV_VERSION}" ]; then
          BASE="${RELEASE_VERSION%%-*}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "${BASE}"
          if ! [[ "${MAJOR}" =~ ^[0-9]+$ && "${MINOR}" =~ ^[0-9]+$ && "${PATCH}" =~ ^[0-9]+$ ]]; then
            echo "::error::Cannot auto-compute next dev version from non-semver release_version '${RELEASE_VERSION}'. Pass next_dev_version explicitly."
            exit 1
          fi
          NEXT_DEV_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))-SNAPSHOT"
        fi
        echo "Next dev version: ${NEXT_DEV_VERSION}"
        mvn validate -B -ntp -P write-release-versions -Dreplace.target.version="${NEXT_DEV_VERSION}"
        mvn versions:set -B -ntp -DnewVersion="${NEXT_DEV_VERSION}" -DgenerateBackupPoms=false
        mvn scm:checkin -B -ntp -DpushChanges=true -Dmessage="[update-version] to ${NEXT_DEV_VERSION}" -Dscm.username="${GIT_USER}" -Dscm.password="${RELEASE_TOKEN}"
      shell: bash
